<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UCR — Web Components Lab 09</title>
  <link rel="stylesheet" href="css/global.css">
  <script type="module" src="main.js"></script>

  <style>

    afiche-ucr.original {
    }

    afiche-ucr.verde {
      --afiche-bg:         #2d6a4f;
      --afiche-accent:     #74c69d;
      --afiche-base-color: #1b4332;
    }

    afiche-ucr.verde::part(qr-img) {
      border-color: #74c69d;
    }

    afiche-ucr.verde::part(label) {
      color: rgba(255,255,255,0.6);
    }

    /* Rótulo oscuro que usa CSS Custom Properties*/
    rotulo-ucr.oscuro {
      --rotulo-bg:           #1a1a2e;
      --rotulo-header-color: #e94560;
      --rotulo-footer-bg:    #16213e;
      --rotulo-footer-color: white;
      --fila-bg-hover:       rgba(233,69,96,0.15);
      --fila-sep-color:      rgba(233,69,96,0.3);
    }

    rotulo-ucr.oscuro::part(footer) {
      border-top: 2px solid #e94560;
    }

    rotulo-ucr.oscuro rotulo-fila::part(flecha) {
      color: #e94560;
    }
  </style>
</head>
<body>

  <!-- ══════════════════════════════════════
       AFICHE 1: versión original con slots
       ══════════════════════════════════════ -->
  <afiche-ucr class="original" qr-data="https://www.ucr.ac.cr">

    <!-- slot="titulo": cambia las cajas del encabezado -->
    <span slot="titulo" class="box azul"
          style="display:inline-block;padding:11px 18px;background:#3ec1d3;color:white;
                 font-family:'Fredoka',sans-serif;font-weight:700;font-size:1.15rem;
                 box-shadow:3px 5px 0 rgba(0,0,0,0.22);transform:rotate(-4deg)">
      LA SEDE
    </span>
    <span slot="titulo" class="box blanco"
          style="display:inline-block;padding:11px 18px;background:white;color:black;
                 font-family:'Fredoka',sans-serif;font-weight:700;font-size:1.15rem;
                 box-shadow:3px 5px 0 rgba(0,0,0,0.22);transform:rotate(6deg) translateY(12px)">
      TE
    </span>
    <span slot="titulo" class="box morado"
          style="display:inline-block;padding:11px 18px;background:#7a3eb1;color:white;
                 font-family:'Fredoka',sans-serif;font-weight:700;font-size:1.15rem;
                 box-shadow:3px 5px 0 rgba(0,0,0,0.22);transform:rotate(-2deg) translateY(5px)">
      ACOMPAÑA
    </span>

    <!-- slot="mensaje": cambia el texto del cuerpo -->
    <p slot="mensaje" style="font-family:'Poppins',sans-serif;font-size:1rem;color:rgba(0,0,0,0.55)">
      El respeto no se negocia
    </p>
    <h2 slot="mensaje" style="font-family:'Fredoka',sans-serif;font-size:2rem;color:#7a3eb1;margin-top:6px">
      ¡Pará ya de acosar!
    </h2>

    <!-- slot="qr-texto": texto sobre el QR -->
    <p slot="qr-texto"
       style="font-family:'Poppins',sans-serif;font-size:0.82rem;color:rgba(255,255,255,0.9);line-height:1.5">
      Si necesitas ayuda,<br>escanea este QR.
    </p>

    <!-- slot="iconos": emojis de la base (se pueden poner íconos SVG también) -->
    <span slot="iconos" style="font-size:90px;line-height:1">🐱</span>
    <span slot="iconos" style="font-size:90px;line-height:1">😺</span>

    <!-- slot="label": texto del pie de página -->
    <span slot="label">UCR · Sede de Guanacaste</span>

  </afiche-ucr>


  <!-- ══════════════════════════════════════════════════
       RÓTULO 1: original con slots de encabezado y filas
       ══════════════════════════════════════════════════ -->
  <rotulo-ucr>

    <!-- slot="sede-nombre": nombre de la sede -->
    <span slot="sede-nombre">Sede de Guanacaste</span>

    <!-- slot="sede-subtitulo": subtítulo del encabezado -->
    <span slot="sede-subtitulo">Dirección de instalaciones</span>

    <!-- slot default: las filas de destinos -->
    <rotulo-fila destino="Aulas 5, 6, 7"                       direccion="➜"></rotulo-fila>
    <rotulo-fila destino="Apoyo Informático"                    direccion="➜"></rotulo-fila>
    <rotulo-fila destino="Servidores"                           direccion="➜"></rotulo-fila>
    <rotulo-fila destino="Laboratorio 1 y 2"                    direccion="➜"></rotulo-fila>
    <rotulo-fila destino="Coordinación Informática Empresarial" direccion="➜"></rotulo-fila>

    <!-- slot="logo": logo del footer -->
    <span slot="logo" style="font-family:'Fredoka',sans-serif;font-size:1.6rem;letter-spacing:0.08em;color:#0d2a5c;display:block;text-align:center">
      UCR
      <small style="display:block;font-family:'Poppins',sans-serif;font-size:0.65rem;opacity:0.55;letter-spacing:0.06em;text-transform:uppercase">
        Universidad de Costa Rica
      </small>
    </span>

  </rotulo-ucr>


  <rotulo-ucr class="oscuro">

    <span slot="sede-nombre">Rodrigo Facio</span>
    <span slot="sede-subtitulo">Edificio Administrativo</span>

    <rotulo-fila destino="Rectoría"           direccion="▶"></rotulo-fila>
    <rotulo-fila destino="Vicerrectoría"      direccion="▶"></rotulo-fila>
    <rotulo-fila destino="Oficina Jurídica"   direccion="▶"></rotulo-fila>
    <rotulo-fila destino="Recursos Humanos"   direccion="▶"></rotulo-fila>

    <span slot="logo" style="font-family:'Fredoka',sans-serif;font-size:1.6rem;letter-spacing:0.08em;color:white;display:block;text-align:center">
      UCR
      <small style="display:block;font-family:'Poppins',sans-serif;font-size:0.65rem;opacity:0.55;letter-spacing:0.06em;text-transform:uppercase;color:white">
        Sede Central
      </small>
    </span>

  </rotulo-ucr>

</body>
</html>
